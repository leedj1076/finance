<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>예산 편집기 개편안 · 03-ai-request-dialog</title>
</head>
<body>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #ffffff; color: #18181b; font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; font-size: 13px; line-height: 1.5; font-variant-numeric: tabular-nums; }
    a { color: #2563eb; text-decoration: none; } a:hover { color: #18181b; }
    .t-title { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
    .t-section { font-size: 15px; font-weight: 600; }
    .t-body { font-size: 13px; } .t-strong { font-size: 13px; font-weight: 600; }
    .t-caption { font-size: 12px; } .t-small { font-size: 11px; }
    .t-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    .muted { color: #71717a; } .faint { color: #a1a1aa; } .ink { color: #18181b; }
    .blue { color: #2563eb; } .red { color: #dc2626; } .green { color: #16a34a; } .amber { color: #d97706; } .violet { color: #7c3aed; }
    .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: #71717a; white-space: nowrap; }
    .chip i { display: inline-block; width: 7px; height: 7px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; height: 34px; padding: 0 14px; background: #18181b; color: #ffffff; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .btn.h30 { height: 30px; padding: 0 12px; font-size: 12px; }
    .btn.outline { background: #ffffff; color: #18181b; border: 1px solid #e4e4e7; }
    .btn.dim { opacity: 0.5; }
    .nav { display: inline-flex; align-items: stretch; height: 34px; border: 1px solid #e4e4e7; font-size: 12px; }
    .nav span { display: flex; align-items: center; padding: 0 12px; border-left: 1px solid #e4e4e7; }
    .nav span:first-child { border-left: 0; } .nav .go { background: #18181b; color: #ffffff; font-weight: 600; }
    .bar { display: flex; align-items: center; gap: 28px; height: 52px; border-top: 1px solid #18181b; border-bottom: 1px solid #18181b; background: #ffffff; }
    .bar .kv { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
    .bar .k { font-size: 12px; color: #71717a; } .bar .v { font-size: 15px; font-weight: 600; }
    .bar .target { display: inline-flex; align-items: baseline; gap: 6px; border-bottom: 1px dashed #a1a1aa; padding-bottom: 1px; cursor: pointer; }
    .thead { display: grid; gap: 16px; align-items: end; padding: 12px 0 10px; border-bottom: 1px solid #18181b; }
    .th { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #71717a; }
    .th .sub { display: block; margin-top: 3px; font-size: 11px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #a1a1aa; }
    .th .act { display: block; margin-top: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0; text-transform: none; color: #2563eb; }
    .group { display: flex; align-items: baseline; gap: 8px; padding: 18px 0 6px; }
    .group .name { font-size: 13px; font-weight: 600; } .group .note { font-size: 12px; color: #a1a1aa; }
    .row { display: grid; gap: 16px; align-items: start; padding: 12px 0; border-bottom: 1px solid #e4e4e7; }
    .major { font-size: 13px; font-weight: 600; }
    .input { display: flex; align-items: center; gap: 6px; }
    .input .box { display: flex; align-items: center; justify-content: flex-end; height: 34px; flex: 1; padding: 0 10px; border: 1px solid #e4e4e7; background: #ffffff; font-size: 13px; }
    .input .box.focus { border-color: #2563eb; }
    .src { display: inline-flex; align-items: center; justify-content: flex-end; height: 34px; width: 100%; padding: 0 10px; box-sizing: border-box; border: 1px solid transparent; font-size: 13px; text-align: right; background: #ffffff; }
    .src.on { background: #f4f4f5; font-weight: 600; border-color: #e4e4e7; }
    .src.ai.on { background: #f5f3ff; border-color: #ddd6fe; }
    .src.off { color: #a1a1aa; }
    .src.stale { color: #a1a1aa; text-decoration: line-through; }
    .cap { display: block; margin-top: 4px; font-size: 11px; color: #71717a; text-align: right; }
    .cap.l { text-align: left; }
    .pop { background: #ffffff; border: 1px solid #18181b; box-shadow: 0 8px 24px rgba(24, 24, 27, 0.12); }
    .status { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .status i { display: inline-block; width: 7px; height: 7px; flex: none; }
    .note { font-size: 12px; color: #71717a; }
    .label-tag { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border: 1px solid #e4e4e7; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #71717a; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field .lab { font-size: 12px; font-weight: 600; }
    .sel { display: inline-flex; align-items: center; justify-content: space-between; height: 34px; padding: 0 10px; border: 1px solid #e4e4e7; font-size: 13px; background: #fff; }
    .textarea { min-height: 96px; padding: 10px; border: 1px solid #e4e4e7; font-size: 13px; color: #18181b; }

  </style>
<div style="width: 1000px; box-sizing: border-box; background: #ffffff;">
<div style="position: relative; width: 1000px; height: 720px; background: #f4f4f5; overflow: hidden;">
  <div style="position: absolute; inset: 0; background: rgba(24, 24, 27, 0.35);"></div>
  <div class="pop" style="position: absolute; left: 180px; top: 56px; width: 640px; box-sizing: border-box; padding: 24px; box-shadow: 0 24px 60px rgba(24, 24, 27, 0.3);">
    <div style="display: flex; justify-content: space-between; align-items: baseline;"><span class="t-section">AI 예산 추천 요청 · 2026년 10월</span><span class="t-caption muted">닫기</span></div>
    <div class="t-caption muted" style="margin-top: 8px;">월평균 수입 6,115,000 · 목표 저축률 30% · 상한 4,280,500 · 지금 편집안을 참고합니다</div>
    <div class="field" style="margin-top: 20px;">
      <span class="lab">참고 메모 <span class="muted" style="font-weight: 400;">선택</span></span>
      <div class="textarea">10월 초 추석 장보기 예정. 여행은 11월로 미룸.</div>
      <span class="t-small faint" style="text-align: right;">31 / 4,000자</span>
    </div>
    <div class="field" style="margin-top: 16px;">
      <span class="lab">예정 지출 <span class="muted" style="font-weight: 400;">선택 · 꼭 확보할 금액만</span></span>
      <div style="display: grid; grid-template-columns: 140px 130px minmax(0, 1fr) 60px; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid #e4e4e7; border-bottom: 1px solid #e4e4e7;" class="t-body">
        <span>경조사</span><span style="text-align: right;">300,000</span><span class="muted">사촌 결혼식 축의금</span><a class="t-caption red" href="#" style="text-align: right;">삭제</a>
      </div>
      <div style="display: grid; grid-template-columns: 140px 130px minmax(0, 1fr) 60px; gap: 8px; align-items: center; margin-top: 8px;">
        <span class="sel">카테고리 <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="#71717a" stroke-width="1.4"/></svg></span><span class="sel" style="justify-content: flex-end; color: #a1a1aa;">원</span><span class="sel" style="color: #a1a1aa;">메모</span><span class="btn h30 outline" style="height: 34px;">추가</span>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid #e4e4e7;">
      <a class="t-caption" href="#">지난 요청의 프롬프트 보기</a>
      <div style="display: flex; gap: 8px;"><span class="btn outline">취소</span><span class="btn">추천 요청</span></div>
    </div>
    <div class="t-small faint" style="margin-top: 12px;">Mac에서 1~2분 걸립니다. 완료되면 표의 AI 열이 채워지고, 기다리는 동안 편집은 계속할 수 있습니다.</div>
  </div>
</div>
</div>
</body>
</html>
